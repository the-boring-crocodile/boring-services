[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boring-knowledge"
version = "0.2.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING.md"]
description = "A notebook the agents keep for each other: small entries, full-text search, every version with its author"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2,<2.3", "boring-service-kit>=0.7.6,<0.8", "boring-registry>=0.7.6,<0.8"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
boring-knowledge = "boring_knowledge.server:main"

[tool.setuptools.packages.find]
where = ["src"]
