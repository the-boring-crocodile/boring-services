<g class="node"><title>source</title><rect x="20" y="534" width="192" height="85" fill="#1b1b19" stroke="#747570" stroke-width="1.2"/>
<text x="30.0" y="552.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#dfdfdf" xml:space="preserve">D365 source</text>
<text x="30.0" y="567.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">[PackagesLocalDirectory]</text>
<text x="30.0" y="582.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">XML elements, labels and</text>
<text x="30.0" y="597.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">descriptors; yours, under</text>
<text x="30.0" y="612.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">the terms you got it on</text>
<path transform="translate(180,542) scale(0.917)" d="M2.5 6h7l2 2.5h10v11.5h-19z" fill="none" stroke="#747570" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="20.0" y="653.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#dfdfdf" xml:space="preserve">Read the picture</text>
<text x="20.0" y="669.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#7b9682" xml:space="preserve">Sage box · the Pond family</text>
<text x="20.0" y="685.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#7f95b5" xml:space="preserve">Pale blue box · a person, their client</text>
<text x="20.0" y="701.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">Grey box · others' software or data</text>
<text x="20.0" y="717.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">Frame: its label says what it is</text>
<text x="20.0" y="733.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">Arrow: from caller to callee</text>
<text x="242.0" y="653.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#dfdfdf" xml:space="preserve">Lines</text>
<text x="242.0" y="669.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#6f8da4" xml:space="preserve">Blue · MCP, wherever it runs</text>
<text x="242.0" y="685.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#9d7f58" xml:space="preserve">Dotted ochre · not MCP, local:</text>
<text x="242.0" y="701.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">a socket, a file, a command</text>
<text x="464.0" y="653.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#dfdfdf" xml:space="preserve">Scope and limits</text>
<text x="464.0" y="669.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">A snapshot does not follow edits:</text>
<text x="464.0" y="685.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">check source_info; build a new one</text>
<text x="464.0" y="701.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">when the source changes.</text>
<text x="464.0" y="717.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">Ships no Microsoft code; customer code</text>
<text x="464.0" y="733.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">only if you build from it.</text>
</svg>
