<svg xmlns="http://www.w3.org/2000/svg" width="694pt" height="828pt" viewBox="0 0 694 828">
<rect x="0" y="0" width="694" height="828" fill="#ffffff"/>
<text x="20.0" y="36.0" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#111111" xml:space="preserve">Canvas: one drawing, an agent and a person</text>
<text x="20.0" y="56.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">Dynamic view · Canvas 0.2.19</text>
<text x="20.0" y="72.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">The agent pushes a drawing, the person draws on it, the agent reads the marks back as data.</text>
<g class="cluster"><rect x="6" y="236" width="664" height="282" fill="none" stroke="#929a96" stroke-width="1"/>
<text x="16.0" y="508.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">Canvas · one container, its own account</text>
</g>
<g class="edge"><title>agent->mcp</title><path fill="none" stroke="#587b96" stroke-width="1.4" d="M116.0,174.0 L116.0,241.0"/><polygon fill="#587b96" stroke="#587b96" points="116.0,250.0 120.0,241.0 112.0,241.0"/></g>
<g class="edge"><title>mcp->store</title><path fill="none" stroke="#9b784b" stroke-dasharray="1.5,4" stroke-linecap="round" stroke-width="2" d="M165.3,320.0 L270.8,394.8"/><polygon fill="#9b784b" stroke="#9b784b" points="278.1,400.0 273.1,391.5 268.4,398.1"/></g>
<g class="edge"><title>operator->store</title><path fill="none" stroke="#9b784b" stroke-dasharray="1.5,4" stroke-linecap="round" stroke-width="2" d="M338.0,174.0 L338.0,391.0"/><polygon fill="#9b784b" stroke="#9b784b" points="338.0,400.0 342.0,391.0 334.0,391.0"/></g>
<g class="edge"><title>operator->person</title><path fill="none" stroke="#8c8d87" stroke-dasharray="7,4" stroke-width="1.4" d="M434.0,139.0 L455.0,139.0"/><polygon fill="#8c8d87" stroke="#8c8d87" points="464.0,139.0 455.0,135.0 455.0,143.0"/></g>
<g class="edge"><title>person->web</title><path fill="none" stroke="#3f7a72" stroke-width="1.4" d="M560.0,174.0 L560.0,241.0"/><polygon fill="#3f7a72" stroke="#3f7a72" points="560.0,250.0 564.0,241.0 556.0,241.0"/></g>
<g class="edge"><title>web->store</title><path fill="none" stroke="#9b784b" stroke-dasharray="1.5,4" stroke-linecap="round" stroke-width="2" d="M510.7,320.0 L405.2,394.8"/><polygon fill="#9b784b" stroke="#9b784b" points="397.9,400.0 407.6,398.1 402.9,391.5"/></g>
<g class="node"><title>agent</title><rect x="20" y="104" width="192" height="70" fill="#edf2fa" stroke="#7489a5" stroke-width="1.2"/>
<text x="30.0" y="122.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111" xml:space="preserve">AI agent</text>
<text x="30.0" y="137.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">[AI client · over MCP]</text>
<text x="30.0" y="152.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">Claude, Copilot or any</text>
<text x="30.0" y="167.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">MCP client</text>
<path transform="translate(180,112) scale(0.917)" d="M3.5 4.5h17v11.5H10l-5 4v-4H3.5z M7.5 9h9 M7.5 12h6" fill="none" stroke="#7489a5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="node"><title>operator</title><rect x="242" y="104" width="192" height="70" fill="#edf2fa" stroke="#7489a5" stroke-width="1.2"/>
<text x="252.0" y="122.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111" xml:space="preserve">Operator</text>
<text x="252.0" y="137.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">[person · on the host]</text>
<text x="252.0" y="152.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">runs boring-canvas-admin</text>
<text x="252.0" y="167.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">token for the person</text>
<path transform="translate(402,112) scale(0.917)" d="M12 3.5a4 4 0 1 1 0 8a4 4 0 1 1 0-8z M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="none" stroke="#7489a5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="node"><title>person</title><rect x="464" y="104" width="192" height="70" fill="#edf2fa" stroke="#7489a5" stroke-width="1.2"/>
<text x="474.0" y="122.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111" xml:space="preserve">Person</text>
<text x="474.0" y="137.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">[a web browser]</text>
<text x="474.0" y="152.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">opens the link, sees the</text>
<text x="474.0" y="167.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">drawing, draws on it</text>
<path transform="translate(624,112) scale(0.917)" d="M12 3.5a4 4 0 1 1 0 8a4 4 0 1 1 0-8z M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="none" stroke="#7489a5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="node"><title>mcp</title><rect x="20" y="250" width="192" height="70" fill="#edf5ef" stroke="#7a9783" stroke-width="1.2"/>
<text x="30.0" y="268.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111" xml:space="preserve">MCP tools</text>
<text x="30.0" y="283.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">[Canvas server · Python]</text>
<text x="30.0" y="298.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">create_canvas, push_scene,</text>
<text x="30.0" y="313.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">get_elements, get_edits</text>
<path transform="translate(180,258) scale(0.917)" d="M9 6.5 3.5 12 9 17.5 M15 6.5 20.5 12 15 17.5" fill="none" stroke="#7a9783" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="node"><title>web</title><rect x="464" y="250" width="192" height="70" fill="#edf5ef" stroke="#7a9783" stroke-width="1.2"/>
<text x="474.0" y="268.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111" xml:space="preserve">Canvas page</text>
<text x="474.0" y="283.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">[Canvas server · HTTPS]</text>
<text x="474.0" y="298.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">serves the Excalidraw editor;</text>
<text x="474.0" y="313.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">the page syncs every second</text>
<path transform="translate(624,258) scale(0.917)" d="M9 6.5 3.5 12 9 17.5 M15 6.5 20.5 12 15 17.5" fill="none" stroke="#7a9783" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="node"><title>store</title><rect x="242" y="400" width="192" height="85" fill="#edf5ef" stroke="#7a9783" stroke-width="1.2"/>
<text x="252.0" y="418.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111" xml:space="preserve">Canvas store</text>
<text x="252.0" y="433.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">[SQLite · state folder]</text>
<text x="252.0" y="448.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">the drawing (SVG, cleaned),</text>
<text x="252.0" y="463.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">the person's marks; deleted</text>
<text x="252.0" y="478.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">42 days after creation</text>
<path transform="translate(402,408) scale(0.917)" d="M6 2.5h8.5l4 4v15H6z M14.5 2.5v4h4 M9 12h6 M9 15.5h6" fill="none" stroke="#7a9783" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="badge"><rect x="95.2" y="204.0" width="41.6" height="16" rx="8" fill="#ffffff" stroke="#587b96" stroke-width="1.2"/><text x="104.4" y="215.6" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#587b96" xml:space="preserve">1, 7</text></g>
<g class="badge"><rect x="210.5" y="352.0" width="22.4" height="16" rx="8" fill="#ffffff" stroke="#9b784b" stroke-width="1.2"/><text x="218.8" y="363.6" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#9b784b" xml:space="preserve">2</text></g>
<g class="badge"><rect x="326.8" y="279.0" width="22.4" height="16" rx="8" fill="#ffffff" stroke="#9b784b" stroke-width="1.2"/><text x="335.1" y="290.6" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#9b784b" xml:space="preserve">3</text></g>
<g class="badge"><rect x="437.8" y="109.0" width="22.4" height="16" rx="8" fill="#ffffff" stroke="#8c8d87" stroke-width="1.2"/><text x="446.1" y="120.6" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#8c8d87" xml:space="preserve">4</text></g>
<g class="badge"><rect x="548.8" y="204.0" width="22.4" height="16" rx="8" fill="#ffffff" stroke="#3f7a72" stroke-width="1.2"/><text x="557.1" y="215.6" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#3f7a72" xml:space="preserve">5</text></g>
<g class="badge"><rect x="443.1" y="352.0" width="22.4" height="16" rx="8" fill="#ffffff" stroke="#9b784b" stroke-width="1.2"/><text x="451.4" y="363.6" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#9b784b" xml:space="preserve">6</text></g>
<text x="20.0" y="552.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111" xml:space="preserve">Read the picture</text>
<text x="20.0" y="568.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#57765f" xml:space="preserve">Sage box · the Pond family</text>
<text x="20.0" y="584.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#526c91" xml:space="preserve">Pale blue box · a person, their client</text>
<text x="20.0" y="600.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">Frame: its label says what it is</text>
<text x="20.0" y="616.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">Arrow: from caller to callee</text>
<text x="242.0" y="552.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111" xml:space="preserve">Lines</text>
<text x="242.0" y="568.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#587b96" xml:space="preserve">Blue · MCP, wherever it runs</text>
<text x="242.0" y="584.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#3f7a72" xml:space="preserve">Teal · plain HTTPS (a browser, bytes)</text>
<text x="242.0" y="600.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#9b784b" xml:space="preserve">Dotted ochre · not MCP, local:</text>
<text x="242.0" y="616.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">a socket, a file, a command</text>
<text x="242.0" y="632.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#8c8d87" xml:space="preserve">Dashed grey · handed over, not a call</text>
<text x="242.0" y="648.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve"></text>
<text x="242.0" y="664.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111" xml:space="preserve">Steps</text>
<text x="242.0" y="680.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">1 create_canvas, then push_scene(svg)</text>
<text x="242.0" y="696.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">2 cleaned of scripts, then stored</text>
<text x="242.0" y="712.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">3 the operator gets the browser token</text>
<text x="242.0" y="728.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">4 and gives it with the link</text>
<text x="242.0" y="744.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">5 the person opens the page, draws</text>
<text x="242.0" y="760.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">6 the page saves the person's marks</text>
<text x="242.0" y="776.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">7 get_edits: shapes, text, positions,</text>
<text x="242.0" y="792.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">   as data, not a screenshot</text>
<text x="464.0" y="552.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111" xml:space="preserve">Scope and limits</text>
<text x="464.0" y="568.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">Each canvas has its own browser token,</text>
<text x="464.0" y="584.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">apart from the agent's MCP access.</text>
<text x="464.0" y="600.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">With --unsafe-url-auth the agent gets</text>
<text x="464.0" y="616.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">a link with the token instead of 3-4.</text>
<text x="464.0" y="632.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" xml:space="preserve">Not shown: sign-in, owners per caller.</text>
</svg>
