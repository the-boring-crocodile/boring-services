<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <g>
    <!-- stem -->
    <path d="M150,158 C138,210 162,240 150,290 C142,330 158,350 150,392"
          stroke="#2E7D32" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- leaves -->
    <g transform="translate(150,232) rotate(-150)">
      <path d="M0,0 C18,-16 46,-14 60,0 C46,14 18,16 0,0 Z" fill="#43A047"/>
      <path d="M4,0 C24,-2 44,-1 56,0" stroke="#2E7D32" stroke-width="1.3" fill="none"/>
    </g>
    <g transform="translate(150,308) rotate(18)">
      <path d="M0,0 C18,-16 46,-14 60,0 C46,14 18,16 0,0 Z" fill="#4CAF50"/>
      <path d="M4,0 C24,-2 44,-1 56,0" stroke="#2E7D32" stroke-width="1.3" fill="none"/>
    </g>
    <!-- outer petal ring -->
    <g fill="#8E1B2E" stroke="#6B0F1A" stroke-width="1">
      <path d="M150,140 C126,120 122,80 150,60 C178,80 174,120 150,140 Z" transform="rotate(0 150 140)"/>
      <path d="M150,140 C126,120 122,80 150,60 C178,80 174,120 150,140 Z" transform="rotate(60 150 140)"/>
      <path d="M150,140 C126,120 122,80 150,60 C178,80 174,120 150,140 Z" transform="rotate(120 150 140)"/>
      <path d="M150,140 C126,120 122,80 150,60 C178,80 174,120 150,140 Z" transform="rotate(180 150 140)"/>
      <path d="M150,140 C126,120 122,80 150,60 C178,80 174,120 150,140 Z" transform="rotate(240 150 140)"/>
      <path d="M150,140 C126,120 122,80 150,60 C178,80 174,120 150,140 Z" transform="rotate(300 150 140)"/>
    </g>
    <!-- inner petal ring -->
    <g fill="#C41E3A" stroke="#8E1B2E" stroke-width="1">
      <path d="M150,140 C136,126 134,102 150,88 C166,102 164,126 150,140 Z" transform="rotate(18 150 140)"/>
      <path d="M150,140 C136,126 134,102 150,88 C166,102 164,126 150,140 Z" transform="rotate(90 150 140)"/>
      <path d="M150,140 C136,126 134,102 150,88 C166,102 164,126 150,140 Z" transform="rotate(162 150 140)"/>
      <path d="M150,140 C136,126 134,102 150,88 C166,102 164,126 150,140 Z" transform="rotate(234 150 140)"/>
      <path d="M150,140 C136,126 134,102 150,88 C166,102 164,126 150,140 Z" transform="rotate(306 150 140)"/>
    </g>
    <!-- center -->
    <circle cx="150" cy="140" r="9" fill="#5C0F1A"/>
    <path d="M150,140 C144,132 148,124 156,126 C150,130 148,136 150,140 Z" fill="#7A1626"/>
  </g>
</svg>
