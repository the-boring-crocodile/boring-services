# boring-mcp-ferry: the template a first install turns into HOME/compose.yaml
# (deploy/install.py). From then on that file is the operator's: install and
# deploy never rewrite it; the deploy changes only HOME/.env (BORING_IMAGE).
# @UID@:@GID@ are the service account's, as the OS assigned them.
#
# The ferry carries third-party MCP servers ("backends") to a Pond, or to a
# person's client without one (mcp-ferry README, Without a Pond). Each
# backend is one more service in this file, on an internal network of its own
# that only the ferry also joins: no published port, nothing else reaches it,
# and backends never share a network. Adding one: its block below (image pinned
# by digest), its network, the ferry joining that network, its entry in
# config/config.json, its front end in config/services/NAME.json, its secrets
# in credentials/, and, towards a Pond, `boring-crocodile-admin service-add NAME ...`.

services:
  ferry:
    image: ${BORING_IMAGE}
    user: "@UID@:@GID@"
    restart: unless-stopped
    # Everything the ferry writes is under /data/state (one call log per
    # backend); the image itself stays read-only.
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # A backend's answers pass through the ferry's memory: these bound what a
    # misbehaving one can take (the ferry has no answer size limit of its own).
    mem_limit: 512m
    pids_limit: 128
    ports:
      # Each front end its own port (its config/services/NAME.json), on host
      # loopback only: the reverse proxy forwards to it.
      - "127.0.0.1:18520-18529:18520-18529"
    volumes:
      - ./state:/data/state
      # config.json (the backends) and services/*.json (their front ends), read-only.
      - ./config:/run/config:ro
      # The secrets: each front end's mcp-client-secret, each backend's URL or
      # headers when they are secret; read-only.
      - ./credentials:/run/credentials:ro
    command:
      - "http"
      - "--config=/run/config/config.json"
      - "--state-dir=/data/state"
    networks:
      default:
        # The front ends bind this address only (each config/services/NAME.json:
        # "bind": "172.16.46.2"), never 0.0.0.0: the backends share the ferry's
        # other networks and must not reach the front ends.
        ipv4_address: 172.16.46.2
      # homeassistant: {}        # one line per backend network

  # A backend, for example ha-mcp for a Home Assistant (pin the image by digest):
  #
  # homeassistant:
  #   image: ghcr.io/homeassistant-ai/ha-mcp@sha256:600677bbd7574dfb59682e40d6945f73fcc8852d3684b3671506602473942448  # 8.7.0
  #   restart: unless-stopped
  #   command: ["ha-mcp-web"]                    # the image's default is its stdio mode
  #   env_file: ./credentials/homeassistant.env   # HOMEASSISTANT_URL, HOMEASSISTANT_TOKEN,
  #                                                # MCP_SECRET_PATH, MCP_HOST=0.0.0.0, MCP_PORT=8086,
  #                                                # READ_ONLY_MODE=true, HA_MCP_DISABLE_SETTINGS_UI=true,
  #                                                # HA_MCP_DISABLE_UPDATE_CHECK=true (it has no way out)
  #   read_only: true                            # it runs as its own user, mcpuser; its settings
  #   tmpfs: ["/home/mcpuser:size=16m", "/tmp:size=16m"]   # live in memory only
  #   cap_drop: [ALL]
  #   security_opt: ["no-new-privileges:true"]
  #   mem_limit: 512m
  #   pids_limit: 128
  #   networks:
  #     - homeassistant          # the ferry reaches it here (no ports)
  #     - hass-mcp               # and it reaches Home Assistant here, nothing else

# A fixed subnet outside Docker's pools, so a host firewall rule that lets the
# ferry reach the control plane (from 172.16.46.0/24) cannot go stale.
# Canvas has 172.16.42.0/24, Knowledge 172.16.43.0/24, Sourcecache 172.16.44.0/24,
# Fishmarket has none of its own: it joins the proxy's network.
networks:
  default:
    ipam:
      config:
        - subnet: 172.16.46.0/24
  # homeassistant:
  #   internal: true             # no route out: only the ferry and the backend are on it
  # hass-mcp:
  #   external: true             # `docker network create --internal hass-mcp` once: only
  #   name: hass-mcp             # ha-mcp and Home Assistant (whose stack also names it
  #                              # external) are on it; ha-mcp sees none of HA's other networks
