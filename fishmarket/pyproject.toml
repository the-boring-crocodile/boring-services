[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boring-fishmarket"
version = "0.2.0"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING.md"]
description = "Temporary authenticated file handovers"
requires-python = ">=3.12"
dependencies = ["mcp>=2.2,<2.3", "boring-service-kit>=0.8.0,<0.9", "boring-registry>=0.8.0,<0.9", "httpx2>=2.13.1,<2.14"]

[project.scripts]
boring-fishmarket = "boring_fishmarket.main:main"
boring-fishmarket-transfer = "boring_fishmarket.helper:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boring_fishmarket = ["web/*"]
